<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Cafe – Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand"><span class="brand-mark">C</span> Campus Cafe</a>
      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html">Cart <span class="cart-badge">0</span></a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </div>
  </header>

  <main class="auth-wrap">
    <form id="registerForm" class="card-form" novalidate>
      <h2>Create Account</h2>
      <p class="sub">Join Campus Cafe in seconds</p>

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Abebe Kebede" />
        <div class="error-msg" data-err="fullname"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="student@university.edu" />
        <div class="error-msg" data-err="email"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" />
        <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="error-msg" data-err="password"></div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repeat password" />
        <div class="error-msg" data-err="confirm"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Register</button>
      <p class="form-foot">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <footer class="footer"><p>© 2026 Campus Cafe</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
